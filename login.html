<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Little Surprise 🎁 | Birthday Memories</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
            font-family: 'DM Sans', sans-serif;
            background:
                radial-gradient(circle at 15% 20%, #ffffff 0, transparent 30%),
                radial-gradient(circle at 85% 80%, #f8dce5 0, transparent 35%),
                linear-gradient(135deg, #fff1f2, #fff8ed, #fce7f3);
            color: #514047;
            overflow-x: hidden;
        }

        /* Login card */

        .login-card {
            width: 100%;
            max-width: 430px;
            padding: 38px 35px;
            text-align: center;
            background: rgba(255, 255, 255, 0.91);
            border: 1px solid rgba(198, 160, 110, 0.35);
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(130, 85, 95, 0.15);
            position: relative;
            z-index: 2;
        }

        .top-label {
            color: #b18a55;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2.8px;
            margin-bottom: 12px;
        }

        /* Gift box illustration */

        .gift-container {
            height: 145px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }

        .gift {
            width: 115px;
            height: 95px;
            position: relative;
            margin-top: 30px;
            animation: giftFloat 3s ease-in-out infinite;
        }

        .gift-box {
            position: absolute;
            bottom: 0;
            width: 115px;
            height: 72px;
            background: linear-gradient(135deg, #d99bb1, #b97996);
            border-radius: 5px 5px 12px 12px;
            box-shadow: 0 12px 22px rgba(169, 121, 145, 0.25);
        }

        .gift-box::before {
            content: "";
            position: absolute;
            left: 47px;
            width: 21px;
            height: 100%;
            background: #f7dfb1;
        }

        .gift-lid {
            position: absolute;
            top: 10px;
            left: -7px;
            width: 129px;
            height: 22px;
            background: linear-gradient(135deg, #e9b8ca, #c98da7);
            border-radius: 6px;
            z-index: 2;
        }

        .gift-lid::before {
            content: "";
            position: absolute;
            left: 54px;
            width: 21px;
            height: 22px;
            background: #f7dfb1;
        }

        .ribbon-left,
        .ribbon-right {
            position: absolute;
            top: -19px;
            width: 34px;
            height: 27px;
            border: 7px solid #c28b51;
            border-radius: 50% 50% 10% 50%;
            z-index: 3;
        }

        .ribbon-left {
            left: 30px;
            transform: rotate(25deg);
        }

        .ribbon-right {
            right: 30px;
            transform: scaleX(-1) rotate(25deg);
        }

        .gift-bow-center {
            position: absolute;
            top: 4px;
            left: 51px;
            width: 14px;
            height: 17px;
            background: #b78348;
            border-radius: 50%;
            z-index: 4;
        }

        @keyframes giftFloat {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-9px) rotate(2deg);
            }
        }

        /* Heading and description */

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 34px;
            color: #80556a;
            margin-bottom: 12px;
        }

        .description {
            font-size: 14px;
            line-height: 1.8;
            color: #887780;
            margin-bottom: 28px;
        }

        /* Form fields */

        .input-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #765c67;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #ead9df;
            border-radius: 12px;
            background: #fffafb;
            outline: none;
            font-size: 14px;
            font-family: inherit;
            transition: 0.25s;
        }

        input:focus {
            border-color: #bd91a7;
            box-shadow: 0 0 0 3px rgba(189, 145, 167, 0.12);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 65px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: #a4778e;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Login button */

        .login-button {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #bd91a7, #a97991);
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 7px 18px rgba(169, 121, 145, 0.18);
        }

        .login-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 23px rgba(169, 121, 145, 0.3);
        }

        .login-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        #message {
            min-height: 22px;
            margin-top: 18px;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        .footer {
            margin-top: 23px;
            font-size: 12px;
            color: #a18d96;
        }

        /* Background sparkle layers */

        #sparkleContainer,
        #fallingSparkleContainer {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        #sparkleContainer {
            z-index: 1;
        }

        #fallingSparkleContainer {
            z-index: 1;
        }

        /* Twinkling stars */

        .sparkle {
            position: absolute;
            color: #c5a36e;
            pointer-events: none;
            opacity: 0;
            animation: sparkle 3s ease-in-out infinite;
            text-shadow: 0 0 8px rgba(197, 163, 110, 0.4);
            will-change: transform, opacity;
        }

        @keyframes sparkle {

            0%,
            100% {
                opacity: 0.08;
                transform: scale(0.5) rotate(0deg);
            }

            50% {
                opacity: 0.85;
                transform: scale(1.3) rotate(25deg);
            }
        }

        /* Slowly falling golden sparkles */

        .falling-sparkle {
            position: absolute;
            top: -40px;
            color: #d4a64e;
            opacity: 0;
            font-size: 18px;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(212, 166, 78, 0.55);
            animation: goldenFall linear infinite;
            will-change: transform, opacity;
        }

        @keyframes goldenFall {

            0% {
                transform: translate3d(0, -40px, 0) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.75;
            }

            50% {
                transform: translate3d(35px, 50vh, 0) rotate(180deg);
                opacity: 0.65;
            }

            90% {
                opacity: 0.6;
            }

            100% {
                transform: translate3d(-25px, 110vh, 0) rotate(360deg);
                opacity: 0;
            }
        }

        /* Mobile responsive */

        @media (max-width: 480px) {

            .login-card {
                padding: 32px 23px;
            }

            h1 {
                font-size: 29px;
            }
        }

        /* Respect reduced-motion preferences */

        @media (prefers-reduced-motion: reduce) {

            .gift,
            .sparkle,
            .falling-sparkle {
                animation: none;
            }

            .sparkle {
                opacity: 0.35;
            }

            .falling-sparkle {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- Background animation containers -->

    <div id="sparkleContainer" aria-hidden="true"></div>
    <div id="fallingSparkleContainer" aria-hidden="true"></div>

    <main class="login-card">

        <div class="top-label">A LITTLE SURPRISE, JUST FOR YOU</div>

        <div class="gift-container">
            <div class="gift">
                <div class="ribbon-left"></div>
                <div class="ribbon-right"></div>
                <div class="gift-bow-center"></div>
                <div class="gift-lid"></div>
                <div class="gift-box"></div>
            </div>
        </div>

        <h1>Something Special Awaits!</h1>

        <p class="description">
            Someone has wrapped up a little happiness just for you.
            Enter your details and unwrap your birthday memories🎀
        </p>

        <form id="loginForm">

            <div class="input-group">
                <label for="email">Email Address</label>

                <input type="email" id="email" placeholder="Enter your email" autocomplete="username" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>

                <div class="password-wrapper">

                    <input type="password" id="password" placeholder="Enter your password"
                        autocomplete="current-password" required>

                    <button type="button" class="toggle-password" id="togglePassword">
                        Show
                    </button>

                </div>
            </div>

            <button type="submit" class="login-button" id="loginButton">
                Unwrap My Birthday Surprise🎁
            </button>

        </form>

        <p id="message" role="status" aria-live="polite"></p>

        <div class="footer">
            A little gift, made with care just for you🤍
        </div>

    </main>

    <!-- Supabase scripts -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase.js"></script>

    <script>

        /* =====================================
           1. TWINKLING STARS
        ===================================== */

        const sparkleContainer =
            document.getElementById("sparkleContainer");

        const starSymbols = ["✦", "✧", "⋆", "✴", "✳"];

        const STAR_COUNT = 35;

        for (let i = 0; i < STAR_COUNT; i++) {

            const star = document.createElement("span");

            star.className = "sparkle";

            star.textContent =
                starSymbols[Math.floor(Math.random() * starSymbols.length)];

            star.style.left = Math.random() * 100 + "%";
            star.style.top = Math.random() * 100 + "%";

            star.style.fontSize =
                (10 + Math.random() * 19) + "px";

            star.style.animationDelay =
                Math.random() * 4 + "s";

            star.style.animationDuration =
                (2 + Math.random() * 3) + "s";

            sparkleContainer.appendChild(star);
        }


        /* =====================================
           2. FALLING GOLDEN SPARKLES
        ===================================== */

        const fallingSparkleContainer =
            document.getElementById("fallingSparkleContainer");

        const fallingSymbols = ["✧", "✦", "⋆", "✨"];

        const FALLING_SPARKLE_COUNT = 8;

        for (let i = 0; i < FALLING_SPARKLE_COUNT; i++) {

            const fallingStar = document.createElement("span");

            fallingStar.className = "falling-sparkle";

            fallingStar.textContent =
                fallingSymbols[
                Math.floor(Math.random() * fallingSymbols.length)
                ];

            fallingStar.style.left =
                Math.random() * 100 + "%";

            fallingStar.style.fontSize =
                (12 + Math.random() * 14) + "px";

            fallingStar.style.animationDuration =
                (12 + Math.random() * 10) + "s";

            fallingStar.style.animationDelay =
                -(Math.random() * 20) + "s";

            fallingSparkleContainer.appendChild(fallingStar);
        }


        /* =====================================
           3. PASSWORD VISIBILITY
        ===================================== */

        const loginForm =
            document.getElementById("loginForm");

        const message =
            document.getElementById("message");

        const loginButton =
            document.getElementById("loginButton");

        const passwordInput =
            document.getElementById("password");

        const togglePassword =
            document.getElementById("togglePassword");

        togglePassword.addEventListener("click", function () {

            const isPassword =
                passwordInput.type === "password";

            passwordInput.type =
                isPassword ? "text" : "password";

            togglePassword.textContent =
                isPassword ? "Hide" : "Show";
        });


        /* =====================================
           4. CUSTOMER LOGIN
        ===================================== */

        loginForm.addEventListener("submit", async function (event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value.trim();

            const password =
                passwordInput.value;

            message.style.color = "#887780";

            message.textContent =
                "Checking your details...";

            loginButton.disabled = true;

            loginButton.textContent =
                "Please wait...";

            try {

                if (!window.supabaseClient) {

                    throw new Error(
                        "Supabase client not loaded. Please refresh the page."
                    );
                }

                const { data, error } =
                    await window.supabaseClient.auth.signInWithPassword({

                        email: email,
                        password: password

                    });

                if (error) {
                    throw error;
                }

                message.style.color = "#39845b";

                message.textContent =
                    "Login successful! Opening your birthday website... 🎉";

                window.location.replace("./index.html");

            } catch (error) {

                console.error("Login error:", error);

                message.style.color = "#c04b58";

                message.textContent =
                    "Login failed: " + error.message;

                loginButton.disabled = false;

                loginButton.textContent =
                    "Unwrap My Birthday Surprise🎁";
            }
        });

    </script>

</body>

</html>
